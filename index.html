<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Brick Breaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="hud" aria-live="polite">
      <div class="chip"><span>Score</span><strong id="scoreValue">0</strong></div>
      <div class="chip"><span>Lives</span><strong id="livesValue">3</strong></div>
      <div class="chip"><span>Level</span><strong id="levelValue">1</strong></div>
      <div class="chip"><span>Combo</span><strong id="comboValue">x1</strong></div>
      <div class="chip"><span>Best</span><strong id="bestValue">0</strong></div>
    </section>

    <section class="stage">
      <canvas id="game" width="960" height="540" aria-label="Neon Brick Breaker game"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="overlayTitle">Neon Brick Breaker</h1>
        <p id="overlayMessage">Break every brick. Catch power-ups. Keep the combo alive.</p>
        <div class="overlay-actions">
          <button id="startButton" type="button">Start Run</button>
        </div>
      </div>
    </section>

    <section class="controls">
      <button id="pauseButton" type="button" class="ghost">Pause / Resume</button>
      <p>Move: <kbd>Left</kbd>/<kbd>Right</kbd> or mouse/touch</p>
      <p>Pause: <kbd>P</kbd></p>
      <p>Power-ups: Expand, Slow, Multi-Ball</p>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
